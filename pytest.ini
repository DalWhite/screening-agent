[pytest]
# One tree, tests/, in layers (see tests/conftest.py). Markers come from the folder:
#   python -m pytest                unit + integration (no network, no browser)
#   python -m pytest -m e2e         browser end-to-end tests against live local servers
#   python -m pytest -m channels    only the WhatsApp / phone e2e tests
#   python -m pytest -m stress -s   load test (opt-in)
#   python -m pytest -m identity    identity resolution / idempotency scenarios (unit + integration)
# A -m on the command line replaces the default below.
testpaths = tests
pythonpath = .
addopts = -m "not e2e and not stress"
markers =
    unit: one component, everything else faked (tests/unit)
    integration: the whole app in-process, channels through the simulator (tests/integration)
    e2e: Playwright end-to-end tests against live local servers (tests/e2e)
    channels: e2e tests with WhatsApp / phone candidates through the channel simulator (tests/e2e/channels)
    stress: concurrency/load tests with resource metrics (tests/stress; opt-in)
    identity: candidate identity resolution, deduplication and idempotency scenarios (tests/*/identity)
