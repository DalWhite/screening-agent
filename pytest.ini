[pytest]
# Unit/integration tests run by default; browser e2e tests live in e2e/ (python -m pytest e2e).
# Load/stress tests (e2e/stress/) are opt-in even within e2e/: -m stress overrides this.
testpaths = tests
addopts = -m "not stress"
markers =
    e2e: Playwright end-to-end tests against a live local server
    stress: concurrency/load tests with resource metrics (opt-in: python -m pytest e2e -m stress -s)
