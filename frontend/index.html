<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupo Sazón — Screening</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Grupo <span>Sazón</span> · Screening</div>
    <nav>
      <a href="/dashboard">Dashboard</a>
    </nav>
  </header>

  <main class="chat-wrap">
    <div class="stage-chip" id="stage-chip">conectando…</div>
    <div class="messages" id="messages"></div>
    <div id="outcome"></div>
    <div id="resume-banner" class="resume-banner" hidden>
      <span>Dejaste la conversación abierta. Puedes retomarla justo donde la dejaste.</span>
      <button id="resume" type="button">Retomar conversación</button>
    </div>
    <form class="composer" id="composer">
      <input id="text" type="text" autocomplete="off" placeholder="Escribe tu respuesta…" disabled>
      <button id="mic" type="button" class="mic" title="Responder por voz" disabled>🎙</button>
      <select id="mic-lang" title="Idioma del micrófono">
        <option value="es-ES">ES</option>
        <option value="en-US">EN</option>
      </select>
      <label class="tts-toggle" title="Voz del agente"><input id="tts" type="checkbox"> 🔊</label>
      <button id="send" type="submit" disabled>Enviar</button>
      <button id="end" type="button" class="ghost" disabled>Finalizar</button>
    </form>
  </main>

  <script src="/static/chat.js"></script>
</body>
</html>
